# Git hooks 定義（lefthook）。`make hooks`（lefthook install）で導入する。
#
# 方針（.claude/rules/git-hooks.md・conventional-commits.md・security.md）:
# - フックの追加・変更時は .claude/rules/git-hooks.md の方針（時間予算・CI との役割分担）に従う
# - --no-verify によるスキップは禁止
# - Cargo.toml 未追加（TASK-66 の workspace 作成予定）の間、cargo 系ジョブはスキップする
#   （Makefile の HAS_CARGO 判定と同一方針）
# - 開発速度を優先し、CI（.github/workflows/ci.yml の rust-ci 等）が PR ごとに実行する
#   重いチェック（clippy・test）はフックで実行しない（pre-push は置かない）。push 前に
#   手元で確かめたい場合は `make ci`（CI と同等のチェック）を任意で実行する
# - GitHub Actions（ci.yml の rust-ci・lint-docs 等）で実行する検査はフックで重複実行しない
#   （例外は rustfmt-check のみ。理由と計測値は .claude/rules/git-hooks.md）
# - フックに残すのは 1 秒未満で終わり、手元で止める意味があるものに限る:
#   secrets-guard（資格情報をリモートへ送る前に止める。CI では手遅れ）・rustfmt-check・
#   conventional-commits（中間コミットは PR refs に残るため、作成時点で形式を揃える）

pre-commit:
  parallel: true
  jobs:
    # staged の .rs のみ rustfmt --check（整形は make fmt / PostToolUse フックで実施済みの想定）。
    # rustfmt 単体は Cargo.toml を読まず既定 edition 2015 で検査してしまうため、
    # workspace の正である Cargo.toml の edition を明示指定する
    - name: rustfmt-check
      glob: "*.rs"
      run: |
        if [ -f Cargo.toml ] && command -v rustfmt >/dev/null 2>&1; then
          ed=$(sed -n 's/^edition *= *"\([0-9]\{4\}\)".*/\1/p' Cargo.toml | head -n1)
          rustfmt --edition "${ed:-2021}" --check -- {staged_files}
        else
          echo "skip: Cargo.toml 未追加または rustfmt 未導入"
        fi

    # 秘密情報の混入検査（.claude/rules/security.md）。資格情報ファイルの stage を拒否する。
    # 判定は create-commit スキルの RE_CREDFILE / RE_CREDFILE_OK の対と同一の正規表現を
    # ベースにする（PR #6 codex P1 / Bugbot 指摘の是正: `(^|/)` アンカーでサブディレクトリ
    # 内の `.env.*` も検出し、拡張子なしの SSH 鍵 `id_rsa` / `id_ed25519` も拒否する。
    # 一方 `.env.example` 等の雛形・`id_rsa.pub` 等の公開鍵は許可リストで通す。
    # 拡張子 `.env` は旧パターンの検出範囲を維持するため追加している）
    - name: secrets-guard
      run: |
        # プロセス起動回数をファイル数に比例させないため、全ファイル名を 1 回の
        # grep パイプラインで判定する（ファイルごとに printf + grep × 3 を起動する旧実装は
        # --all-files（約 3,000 ファイル）で約 11.8 秒かかった。2026-10-11 計測）。
        # 拒否パターンに一致し、かつ許可リストに一致しない行が 1 行でもあれば拒否する
        # （grep の「一致なし」の終了コード 1 は正常扱いにし、出力の有無で判定する）
        re='(^|/)\.env(\..+)?$|(^|/)(id_rsa|id_ed25519)(\..+)?$|\.(pem|p12|pfx|key|env)$'
        re_ok='\.(example|sample|template|pub)$'
        bad="$(printf '%s\n' {staged_files} | grep -E "$re" | grep -vE "$re_ok")"
        if [ -n "$bad" ]; then
          printf '%s\n' "$bad" | while IFS= read -r f; do
            echo "NG: 秘密情報ファイルがステージされています: $f" >&2
          done
          exit 1
        fi

commit-msg:
  jobs:
    # Conventional Commits 形式の検証（.claude/rules/conventional-commits.md）。
    # オフラインで完結する軽量な正規表現検査とし、正式な commitlint（config-conventional +
    # commitlint.config.mjs）は CI（lint-docs の commitlint ジョブ）・make lint-commits が担う。
    # Merge / Revert / fixup コミットは対象外とする
    - name: conventional-commits
      run: |
        msg="$(head -n1 {1})"
        case "$msg" in
          Merge*|Revert*|fixup!*|squash!*) exit 0 ;;
        esac
        if ! printf '%s' "$msg" | grep -qE '^(feat|fix|perf|refactor|test|docs|build|ci|chore)(\([^)]+\))?!?: .+'; then
          echo "NG: Conventional Commits 形式ではありません: $msg" >&2
          echo "形式: <type>(<scope>): <説明>  （type: feat|fix|perf|refactor|test|docs|build|ci|chore）" >&2
          exit 1
        fi
