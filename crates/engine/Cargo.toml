# `engine::hnsw::HnswIndex::build_with_threads` をスレッド数ラダーで計測し、
# `speedup = median(1) / median(threads)` を出す。spec 由来の pass/fail 閾値は
# 持たない情報提供専用ベンチのため `.github/workflows/*` へは配線しない。
# harness = false / test = false は他ベンチと同一方針。`make
# bench-hnsw-parallel-build`（Makefile）から実行する。
name = "hnsw_parallel_build_bench"
harness = false
test = false

[[bench]]
# 自作 HNSW（`engine::hnsw::HnswIndex`）と外部フレームワーク usearch（対照エンジン。
# TASK-127 CORE-5 で承認済みの依存を再利用）の構築時間（スレッド数ラダー）・
# Recall@10・探索レイテンシを同一条件で比較する実測入口（Issue #402 系 ADR
# `docs/design/ann-index-adoption.md` の実測補強）。`contrast_bench.rs` と同様に
# 対照エンジン（C++ FFI を含む `contrast-bench` feature）へ依存するため
# `required-features` で同 feature を要求し、feature 無指定のビルド（`make
# check-cross` 等）では本ベンチターゲット自体がスキップされる（`harness/contrast.rs`
# 冒頭コメントと同一の failure domain 分離）。spec 由来の pass/fail 閾値は
# 持たない情報提供専用ベンチのため `.github/workflows/*` へは配線しない。
# harness = false / test = false は他ベンチと同一方針。`make bench-hnsw-compare`
# （Makefile）から実行する。判定ロジック自体（時間非依存）は
# harness/hnsw_compare.rs にあり tests/hnsw_compare_accept.rs で make ci 側から
# 回帰検証する（usearch 依存部分は `contrast-bench` feature 限定のテストのみ）。
name = "hnsw_compare_bench"
harness = false
test = false
required-features = ["contrast-bench"]

