name = "relational_p95_bench"
harness = false
test = false

[[bench]]
# Issue #356（親 Issue #355。hybrid_rrf クエリの段別内訳プロファイル切り分け。
# ポインタ: `docs/spec/04-behavior/search.md` SEARCH-1, SEARCH-3）の実測入口。
# `EngineCore::execute_sql` 経由の hybrid_rrf/dense KNN 対照・本文 String 収集・
# `SparseIndex::build`（tokenize/term_freq/doc_freq の累積 3 段）を単一ビルド内で
# 計測し、後続の Issue #357（キャッシュ設計）が対象段を判断できる分解能を提供する。
# spec 由来の pass/fail 閾値は持たない情報提供専用ベンチのため `.github/workflows/*`
# へは配線しない。harness = false / test = false は上記ベンチと同一方針。
# `make bench-hybrid-profile`（Makefile）から実行する。判定ロジック自体（時間非依存）は
# harness/hybrid_profile.rs にあり tests/hybrid_profile_accept.rs で make ci 側から
# 回帰検証する。
# Issue #387: SparseIndex::search_within の段別（可視 subset 構築／df 再計算パス／
# スコアリングパス）実測・疎側再取得ループの発火回数計測を追加。production の
# 疎側再取得ループ本体〔hybrid.rs::sparse_refetch_loop〕を共有内部関数へ抽出し、
# 診断用の公開フック engine::hybrid::sparse_refetch_observed を追加した（通常経路
# の挙動・分岐・定数は不変）。ベンチはこのフックを直接呼び、production から実観測
# した fetch_k 列を使う（予測の複製ではない）。
# Issue #387 PR #416 codex-review P2 指摘対応: `sparse_refetch_observed` を
# 非既定 feature `bench-internals` へ限定したため、本ベンチも
# `required-features` で同 feature を要求する（`contrast_bench` と同パターン）。
# `make lint`/`make test` は `--all-features` のため通常の CI 経路は変わらない。
name = "hybrid_profile_bench"
harness = false
test = false
required-features = ["bench-internals"]

[[bench]]
# Issue #365（前提 Issue #362・`docs/design/knn-stage-profile.md`「`dot_lanes` の
# 実アセンブリ確認」節）の実測入口。`isa.rs` dot カーネルの複数アキュムレータ化
