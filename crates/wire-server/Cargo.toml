# wire-server: PostgreSQL wire プロトコル v3 互換の自作実装を持つクレート。
# engine（コアロジック）を呼び出す接続ハンドリング層（.claude/rules/delegation-impl.md 参照）。
# 外部プロトコルライブラリには依存しない方針（.claude/rules/dependency-policy.md）。
# lib+bin 構成（TASK-67）: 結合テスト（tests/）が内部モジュールを利用できるよう、
# バイナリのロジックは lib.rs 側に置き、main.rs は薄い CLI 層に留める。
[package]
# crates.io 公開名（`.github/workflows/release.yml`）。engine と同じ org 接頭辞。
# バイナリ名は下記 `[[bin]] name = "wire-server"` で据え置き（`target/release/wire-server`・
# ベンチスクリプトの `target.name == "wire-server"` 照合は不変）。
name = "fandhe-db-wire-server"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "PostgreSQL wire protocol v3 compatible server for the fandhe-db engine"

[lib]
name = "wire_server"
path = "src/lib.rs"

[[bin]]
name = "wire-server"
path = "src/main.rs"

[dependencies]
# ワークスペース内クレートへの path 依存。crates.io 公開（`cargo publish`）時は path が
# 剥がされ `version` で解決されるため完全固定の version を併記する。`package =` で
# パッケージ名（crates.io 公開名）と `engine::` のソース内参照名を分離する。
engine = { package = "fandhe-db-engine", path = "../engine", version = "=0.2.0" }

[features]
# Issue #705: テスト専用の commit 後 panic 注入（`--fault-inject
# post-commit-panic`）を有効化する feature gate。default に含めない・依存追加
# なし。engine の `bench-internals` feature と同じ判断枠組み（テナント境界・
# RLS・認証・fail-closed 経路を迂回する API は一切露出しない。露出するのは
# 「CLI を握る者が自プロセスを 1 回だけ commit 後 panic で終了させる」能力の
# みで、発火経路自体は production の RECOVER-6 経路そのもの。詳細は
# `docs/design/three-client-e2e-harness.md`「Issue #705」節）。`make lint`／
# `make test` は `--all-features` のため CI でも常にコンパイル・実行される。
# feature 無効（既定ビルド）側の `--fault-inject` 拒否契約は `make
# test-default-build`（`make ci` に含む）・`ci.yml` の `test-default-build`
# ジョブが検査する（Issue #715・#716）。
fault-injection = []

[[bench]]
# Issue #463: `vector_knn` 786µs（docs/design/crossdb-bench.md）の wire／SQL 表層／
# 距離カーネル・Top-k 内訳を切り分ける実測入口。harness = false / test = false は
# engine 側の性能系ベンチ（`crates/engine/benches/knn_profile_bench.rs` 等）と
# 同一方針（外部依存追加なしの自作計測プロトコル・手動実行専用・make ci 対象外）。
name = "knn_wire_profile_bench"
harness = false
test = false

[[bench]]
# Issue #465: `hybrid_rrf` 6,178µs（docs/design/crossdb-bench.md）の engine 内
# hybrid 経路／SQL 表層／wire 内訳を切り分ける実測入口。knn_wire_profile_bench と
# 同方針（harness = false / test = false・手動実行専用・make ci 対象外）だが、
# `body` 列・SparseIndex を要する hybrid 固有コーパスのため独立させる。
name = "hybrid_wire_profile_bench"
harness = false
test = false

[[bench]]
# Issue #484: 単文 INSERT の wire 往復内訳（`crates/engine/benches/
# ingest_profile_bench.rs` の BENCH_INGEST_PROFILE_MODE=single が計測する
# engine 内部段を補い、wire プロトコル層自体の寄与を切り分ける）。
# knn_wire_profile_bench と同方針（harness = false / test = false・
# 手動実行専用・make ci 対象外・依存追加なし）。
name = "ingest_wire_profile_bench"
harness = false
test = false
