# 変更ログ（増分バックアップ・PITR。RECOVER-14 ポインタ。設計は docs/design/change-log-pitr.md の D1 の層 1）の
# 計装漏れを機械的に防ぐ。書き込み側の表操作は、書いたキーと表のライフサイクルを capture frame へ
# 積むラッパ（crates/engine/src/storage/change_log.rs の CaptureWriteTxn）を必ず経由する。
# CI の `rust-ci` が呼ぶ外部 workflow（Fandhe-AI/actions の `rust-base-ci.yml`）は
# `cargo clippy --workspace --all-targets --all-features -- -D warnings`（`make lint` と同じ）を
# 実行するため、直呼びは CI で落ちる。
#
# 許可する箇所（`#[allow(clippy::disallowed_methods)]`）は次の最小限に限る:
# - crates/engine/src/storage/change_log.rs（ラッパ本体と、記録範囲の例外である本体表・メタ表）
# - crates/engine/src/storage/change_log/archive.rs（アーカイブの保守 commit が書く本体表・メタ表。同上）
# - crates/engine/src/storage/change_log/incremental.rs（増分バックアップの適用が追記する本体表。同上）
# - crates/engine/src/storage/restore_generation.rs（復元の世代専用表。変更ログの捕捉・表世代の対象外で、保守 commit だけが書く）
# - crates/engine/src/storage/read_source.rs（読み取り専用の境界でだけ露出するハンドル）
# - 単体テスト（`#[cfg(test)]`。crates/engine/src/lib.rs の cfg_attr）と、外部クレート側の
#   crates/engine/tests・benches・examples のうち redb を直接開いて検査・破壊するファイル
disallowed-methods = [
    { path = "redb::WriteTransaction::open_table", reason = "use CaptureWriteTxn::open_table_logged (storage::change_log)" },
    { path = "redb::WriteTransaction::delete_table", reason = "use CaptureWriteTxn::delete_table_logged (storage::change_log)" },
    { path = "redb::WriteTransaction::rename_table", reason = "use CaptureWriteTxn::rename_table_logged (storage::change_log)" },
    { path = "redb::WriteTransaction::open_multimap_table", reason = "multimap tables cannot be recorded by the change log" },
    { path = "redb::WriteTransaction::delete_multimap_table", reason = "multimap tables cannot be recorded by the change log" },
    { path = "redb::WriteTransaction::rename_multimap_table", reason = "multimap tables cannot be recorded by the change log" },
]
