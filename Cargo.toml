# fandhe-db workspace（TASK-66: 基盤・工程管理）。
#
# `engine`（コアロジック・検索カーネル・認証・RLS・redb 永続化）と
# `wire-server`（pg wire v3 自作実装のバイナリ）の 2 クレート構成
# （.claude/rules/delegation-impl.md のパスベース委譲マッピングと対応）。
# 依存は本タスクでは追加しない（.claude/rules/dependency-policy.md: 追加はユーザー承認制）。
[workspace]
resolver = "2"
members = ["crates/engine", "crates/wire-server"]

[workspace.package]
# lefthook.yml の rustfmt-check（`sed -n 's/^edition *= *"..."'`）が行頭の
# `edition = "..."` 形式をこのファイルから読むため、この位置・形式を維持すること。
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-db"
# crates.io 公開は `.github/workflows/release.yml`（workflow_dispatch・environment
# `crates-io-release` の承認ゲート）からのみ行う。
publish = true

# CI（`cargo test --workspace --all-features`。`.github/workflows/ci.yml` の rust-ci →
# Fandhe-AI/actions rust-base-ci reusable workflow）の実行時間対策。
# 層 A の Recall 回帰（`hybrid_recall.rs`・`query_planning_recall.rs`・`rerank_recall.rs`
# 等。数万チャンク規模の決定的フィクスチャを PR ごとに走らせる）が unoptimized な
# dev 相当ビルドでは CI 実行時間の過半（約 11 分）を占めていたため、`cargo test` が使う
# `test` プロファイルだけを最適化する。`dev`（`cargo build`／`cargo clippy`）は不変。
#
# - `opt-level = 2`: ホットループの最適化。`debug-assertions`／`overflow-checks` は
#   既定（dev 継承）でも有効だが、`.claude/rules/coding-rust.md` の checked 演算・
#   fail-closed 方針をテストで確実に検証するため明示的に true へ固定する
# - `debug = "line-tables-only"`: バックトレースの行番号は保ちつつ、リンク時間と
#   成果物サイズ（CI の target cache 容量）を抑える
# - `incremental = false`: CI は毎回クリーン（cache 復元後の差分のみ）で incremental
#   の恩恵が薄く、`target/debug/incremental` が cache サイズを押し上げるため無効化
[profile.test]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
incremental = false
