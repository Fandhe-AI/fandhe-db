# cargo-deny 設定。`make deny` が本ファイルと Cargo.toml の両方が存在する時点で
# 自動有効化され、`cargo deny --locked check advisories bans licenses sources` として
# 実行される（実装未着手のため現時点では Makefile 側の HAS_CARGO 判定でスキップされる。
# TASK-66 の workspace 作成後に有効化）。
# 依存方針（.claude/rules/dependency-policy.md）: 依存最小・`=x.y.z` 完全固定・
# 追加はユーザー承認制。Fandhe-AI/rust-ai-library の deny.toml と同一方針。

[graph]
# TASK-127 CORE-5（Issue #176）で `usearch` を `contrast-bench` feature 限定の
# optional 依存として追加した。既定 feature 集合のみを対象にすると当該依存が
# advisories/licenses/sources/bans の監査から漏れるため、optional 依存を含む
# 全 feature を監査対象にする（fail-closed。`cargo tree -p fandhe-db-engine --features
# contrast-bench` で実際に解決される依存集合と一致させる）。
all-features = true

[advisories]
# RUSTSEC アドバイザリ監査（vulnerability / unmaintained / unsound / yanked）。
# ignore へアドバイザリ ID を追加する場合は、理由・解消予定（追跡 Issue 番号）を
# コメント付きで記録し、レビューを必須とする。
version = 2
ignore = [
    # RUSTSEC-2024-0436（`paste`・unmaintained）: Issue #333 でクロスエンコーダ
    # リランカー（`cross-encoder` feature）の依存として追加した `tokenizers` の
    # 推移的依存。`paste` はコンパイル時にのみ展開される proc-macro 専用クレートで
    # 実行時コードを含まず、advisory 種別も unmaintained のみ（既知の脆弱性
    # advisory ではない）。オーナー承認済み（2026-08-30・Issue #333 再 open
    # コメント）。解消予定: `tokenizers` が `paste` 非依存の新版を出すまで、または
    # 別クレートへの置き換えが承認されるまで（追跡: Issue #333）。
    { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time-only proc-macro crate (transitive dep of tokenizers); unmaintained advisory only, no known vulnerability. Owner-approved 2026-08-30 (Issue #333)." },
]

[licenses]
version = 2
include-dev = true
# 本リポは MIT OR Apache-2.0 のデュアルライセンス。依存もこれと互換な permissive
# ライセンスのみ許可する。allow には互換 permissive の代表集合（rust-ai-library の
# Cargo.lock 全域実測で出現した SPDX 識別子集合と同一）を事前許可しておき、推移的依存が
# BSD/ISC 等の一般的な permissive を持つだけで make deny が不要に失敗しないようにする
# （PR #6 codex-review P2 指摘の是正）。ここに無い識別子の追加は依存追加のユーザー承認
# （dependency-policy.md）とセットで行い、コピーレフト（GPL/LGPL/MPL 等）は列挙しない
# ことで fail-closed に検出する。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[sources]
# git 依存・代替レジストリの混入をサプライチェーン観点で fail-closed 検出する
# （全依存は crates.io 由来のみを許可）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# 同一クレートの複数バージョン混入の検出。`=x.y.z` 完全固定方針では重複は原則
# 発生しない前提だが、推移的依存経由の重複は依存元側の追随を待つほかなく "deny" では
# ノイズが上回るため、警告に留めて CI ログで増加傾向を観測する（rust-ai-library と同一判断）。
multiple-versions = "warn"

# バージョン要求 `*` の依存宣言を拒否する（バージョン無指定はサプライチェーン上
# 任意の最新版を受け入れる宣言であり、`=x.y.z` 完全固定方針に反するため fail-closed で弾く）。
wildcards = "deny"
# workspace 内クレート（engine / wire-server）は `publish = false` の private クレートで、
# 相互参照はバージョン無しの path 依存（cargo 上は `*` 扱い）のため、private クレートの
# path 依存に限り wildcards の対象外とする。
allow-wildcard-paths = true
