name: Recall

# TASK-104（ハイブリッド検索カーネルの Recall 受け入れ基準の回帰テスト化。対象
# ビヘイビア: SEARCH-1, SEARCH-2）の閾値ゲート実行。`crates/engine/tests/hybrid_recall.rs`
# の層 B（`#[ignore]` 付き。spec 由来の Recall 下限と比較する閾値ゲート）を
# `make recall-regression` 経由で実行する。層 A（決定的コーパスの固定値回帰）は
# `.github/workflows/ci.yml` の `cargo test` に自動的に含まれるため、本 workflow の対象は
# 層 B のみ。`.github/workflows/bench.yml`（TASK-127）を雛形にする。private submodule
# （docs/spec）は取得しない（README「開発環境構築」: ビルド・テストは spec 抜きで成立する
# 方針）。
#
# TASK-108（リランキング効果測定・対象ビヘイビア: SEARCH-7）の層 B
# （`crates/engine/tests/rerank_recall.rs`。`make rerank-regression` 経由）も
# 同一 job（`recall-regression`）・同一 environment（`recall-gate`）から実行する
# （検証設計・実測経緯は `docs/design/rerank-recall-regression.md` 参照）。
#
# 3 つの gate step（recall-regression・rerank-regression・query-planning-regression）は
# それぞれ `continue-on-error: true` を付与して独立に実行し、job 末尾の
# `Evaluate recall gates` step が各 step の `outcome` を AND 集約して job の合否を
# 決める（Issue #311）。従来は直列実行のみで先頭の hybrid step が fail すると
# 後続 2 step が GitHub Actions の既定挙動で skipped になり、一度も評価されない
# 状態が続いていた（実測: run 33251403345）。独立評価後も 3 step すべて pass の
# 所要時間は従来の直列実行と変わらないため `timeout-minutes: 30` は据え置く。
# 詳細は `docs/design/recall-gate-independent-evaluation.md` 参照。
#
# `schedule` トリガ（毎週月曜 04:00 UTC。`bench.yml`（03:00 UTC）と重ならないよう
# ずらす）は #168 で再追加済み。`schedule` は default branch（main）の workflow
# 定義・最新 commit のみを実行するため `github.ref` は常に `refs/heads/main` に
# なり、下記の `if: github.ref == 'refs/heads/main'`・`checkout ref: main`・
# environment `recall-gate` の保護がそのまま有効に働く。`HYBRID_RECALL_MIN_*` /
# `RERANK_RECALL_MIN_*`（下記 strict モード参照）が environment `recall-gate` に
# 未設定のまま schedule 実行された場合は fail-closed で run が red になり、
# 「一度も評価していない run」が green として埋もれることはない
# （README「Recall 回帰ハーネスの repo secrets」参照）。
#
# `pull_request` トリガは意図的に設定しない（PR #147 codex-review P0 指摘で追加後に
# 巻き戻した。`pull_request` で起動する job は PR 側の untrusted なコード
# （Makefile・テストコード含む）を checkout して実行するため、PR がコードを書き換えて
# `HYBRID_RECALL_MIN_*`（spec 由来の非公開閾値）を標準出力へ書き出すだけで public
# Actions ログから spec の数値基準を取得できてしまう
# ——`.claude/rules/spec-confidentiality.md` の P0 違反。層 B（spec 閾値ゲート）は
# 既定ブランチの trusted なコードのみが走る `workflow_dispatch`（手動）・`schedule`
# （週次自動。#168 で再追加済み）に限定する。PR のマージ判定は層 A（`crates/engine/tests/
# hybrid_recall.rs` の `#[test]`。spec 数値を含まない public な固定値回帰）が担い、
# `.github/workflows/ci.yml` の `cargo test` で PR ごとに常時実行される——という
# 役割分担にする（README「Recall 回帰ハーネスの repo secrets」・
# `docs/design/hybrid-recall-regression.md` 参照）。
#
# `workflow_dispatch` は任意の ref を選択して起動できるため、トリガを絞るだけでは
# 「main の trusted なコードのみが層 B を実行する」前提を満たせない
# （Makefile・テストを書き換えた任意 ref を手動実行すれば同じ経路で spec 閾値を
# public Actions ログへ漏えいできてしまう。PR #147 codex-review 継続指摘）。
# そのため recall-regression job は `if: github.ref == 'refs/heads/main'` で
# main ブランチでの実行にのみ限定し、`actions/checkout` の対象も dispatch 側の
# ref 選択に依存させず `ref: main` で固定する。他 ref を選んで `workflow_dispatch`
# を起動した場合は job がスキップされる。
#
# ただし上記の `if`／`checkout ref: main` は本 workflow YAML 自体に書かれた条件であり、
# write 権限者が別ブランチでこのガードを外した recall.yml を push して
# `workflow_dispatch` すれば、選択した ref の YAML がそのまま実行される
# （workflow_dispatch は選択 ref の workflow 定義を使う）。加えて repo レベルの
# Actions secrets（`secrets.*`）はどのブランチのどの workflow からも読めるため、
# YAML 内の if 条件だけでは `HYBRID_RECALL_MIN_*` の参照を防げない
# （Cursor Bugbot High 指摘。当初の指摘は repo variables に対するものだったが、
# repo レベルの secrets も同じくどのブランチからも読める点は変わらないため、
# secrets 化後も environment によるスコープ限定が引き続き必要）。
#
# そのため実行境界は YAML の条件式ではなく GitHub Environments のブランチ保護で作る:
# `recall-regression` job に `environment: recall-gate` を指定し、
# `HYBRID_RECALL_MIN_*` は repo レベルではなく environment `recall-gate` の
# secrets として設定する（参照記法 `secrets.*` は repo レベルと同じだが、
# environment 指定により解決スコープが repo レベルから environment レベルへ
# 切り替わる）。environment `recall-gate` は deployment branch policy で
# `main` のみに制限して作成する（リポジトリ管理者作業。
# `docs/design/ci-gate-variables.md` 参照）。
# これにより main 以外の ref から起動した run は environment `recall-gate` に
# アクセスできず、その run 内の secrets 参照はすべて未設定（空文字列）に解決される
# ——別ブランチの改変 YAML から `if`／`checkout ref` を外して workflow_dispatch した
# としても、`recall-gate` environment 自体にアクセスできないため閾値を取得できない。
# 既存の `if: github.ref == 'refs/heads/main'`・`checkout ref: main` は
# defense-in-depth として維持する（environment 保護がバイパスされた場合の
# 追加防御。単独では実行境界として不十分な点は上記のとおり）。
#
# なお `HYBRID_RECALL_MIN_*` 等の閾値注入を variables から environment `recall-gate`
# の secrets へ切り替えた経緯（Issue #286。`env:` ブロックがログへ値付きで印字される
# ことによる漏えい）は `docs/design/ci-gate-variables.md` 参照。secrets は Actions が
# 一致文字列を自動的に `***` へマスクするため同じ経路では漏えいしない。上記の
# environment によるブランチ保護は secrets 化後も引き続き実行境界として維持する。
#
# `HYBRID_RECALL_REQUIRE_THRESHOLDS=1`（下の Run step 参照）は strict モードを
# 有効化するフラグで、`HYBRID_RECALL_MIN_*` が未設定の場合を「一度も評価していない
# run」として fail-closed にする（`crates/engine/tests/hybrid_recall.rs::
# resolve_gate_threshold` 参照。ローカル `make recall-regression` にはこのフラグを
# 注入しないため、そちらは従来どおり未設定を opt-in で「対象外」として成功終了する。
# PR #147 codex-review P1 継続指摘対応）。
# `recall_engine`（Issue #412。ADR `docs/design/ann-index-adoption.md` B 案
# 〔Issue #403 Accepted〕の受け入れ条件 3）: 3 ゲートが測定する検索エンジンを
# 選ぶ非機密の opt-in フラグ（`BENCH_CORE6`/`BENCH_CORE16` と同じ扱い。
# `docs/design/ci-gate-variables.md` 参照）。`brute_force` は既存の in-memory
# 測定経路をそのまま通し、実測値・閾値判定に一切影響しない。`hnsw` は SQL 表層
# `EngineCore::from_storage_with_engine` 経由の ANN opt-in 経路（`crates/engine/
# tests/fixtures/recall_engine.rs::RecallEngine`）で同一閾値を判定する。
#
# 以前は `workflow_dispatch` の `inputs.recall_engine`（単一選択・既定
# `brute_force`）を `env:` へ素通しし、`schedule` トリガでは `inputs` が存在
# しないため式が常に空文字列に解決 → `RecallEngine::from_env` が既定
# `brute_force` を選ぶ実装だった。これにより週次 `schedule` 実行では HNSW
# 経路が一度も測定されず、ADR の受け入れ条件「Recall ゲートを ANN 有効経路でも
# 同一閾値で通過」を継続的に検証できていなかった（codex-review P1 指摘・
# Issue #412 PR #438）。そのため `strategy.matrix.recall_engine` で
# `brute_force`/`hnsw` を job ごとに固定 2 系列とし、`workflow_dispatch`・
# `schedule` いずれのトリガでも両エンジンを毎回同一閾値でゲートする（選択式の
# `inputs.recall_engine` は撤去。手動実行時に片方のエンジンだけを検証したい
# 場合は GitHub UI の re-run で個別の matrix job を再実行すればよい）。
#
# Issue #515: HNSW 索引ノードの f16 常駐（`hnsw::ResidentPrecision::F16`。
# Issue #514。`docs/design/hnsw-f16-resident.md`）opt-in の 3 系列目
# `hnsw_f16`（`crates/engine/tests/fixtures/recall_engine.rs::RecallEngine::
# HnswF16`）を matrix へ追加し、`brute_force`/`hnsw`/`hnsw_f16` の 3 系列を
# trigger を問わず常時実行する（#412 と同じ「schedule でも新エンジンが
# 未測定のまま残らない」原則）。実測結果・非 vacuous ガードの拡張内容は
# `docs/design/ann-recall-gate-verification.md`「Issue #515 追記」節参照。
#
# Issue #523: HNSW 索引ノードの I8（SQ8）常駐（`hnsw::ResidentPrecision::I8`。
# Issue #521・#522。`docs/design/hnsw-sq8-resident.md`）opt-in の 4 系列目
# `hnsw_i8`（`crates/engine/tests/fixtures/recall_engine.rs::RecallEngine::
# HnswI8`）を matrix へ追加し、`brute_force`/`hnsw`/`hnsw_f16`/`hnsw_i8` の
# 4 系列を trigger を問わず常時実行する（#412・#515 と同じ原則）。実測結果・
# 非 vacuous ガードの拡張内容は `docs/design/ann-recall-gate-verification.md`
# 「Issue #523 追記」節参照。
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  # --------------------------------------------------
  # recall-regression（TASK-104 層 B 閾値ゲート実行）
  # --------------------------------------------------
  # 第三者 action（actions/checkout）は ci.yml・bench.yml と同一の SHA 固定で参照する
  # （AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは Fandhe-AI/actions のみ）。
  recall-regression:
    # `workflow_dispatch` で main 以外の ref が選ばれた場合は job ごとスキップする
    # （冒頭コメント参照。spec 閾値を任意 ref の書き換えコードへ渡さないための
    # fail-closed な制約）。
    if: github.ref == 'refs/heads/main'
    strategy:
      # `brute_force`/`hnsw`/`hnsw_f16`/`hnsw_i8` の 4 系列を独立 job として
      # 毎回すべてゲートする（冒頭コメント参照。Issue #412 受け入れ条件 3・
      # codex-review P1 指摘対応・Issue #515 で `hnsw_f16`・Issue #523 で
      # `hnsw_i8` を追加）。1 つが fail しても他は評価を継続する。
      fail-fast: false
      matrix:
        recall_engine: [brute_force, hnsw, hnsw_f16, hnsw_i8]
    concurrency:
      # workflow_dispatch は任意の ref を選択して起動できるため、ref を group に
      # 含めて同一 ref の重複実行のみキャンセル対象にする（bench.yml と同一方針。
      # `pull_request` トリガは持たないため PR 番号ベースの group 分けは不要）。
      # `matrix` context は workflow レベルの `concurrency:` からは参照できない
      # （job レベル限定。actionlint 指摘）ため、job レベルの `concurrency:` として
      # 定義し `matrix.recall_engine` を group に含めることで、同一 ref 上で並列
      # 実行する brute_force/hnsw の 2 job が互いをキャンセルし合わないようにする。
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.recall_engine }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # environment 保護（deployment branch policy で main のみに制限。
    # リポジトリ管理者が事前に作成する）が実際の実行境界。`secrets.HYBRID_RECALL_MIN_*`
    # はこの environment の secrets として設定し、repo レベルには置かない
    # （冒頭コメント参照。Cursor Bugbot High 指摘対応＋Issue #286 の secrets 化）。
    environment: recall-gate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # dispatch 側の ref 選択に依存させず、常に main を checkout する
          # （`if: github.ref == 'refs/heads/main'` と合わせた二重の固定。
          # 万一 if 条件をすり抜けても untrusted な ref のコードを実行しない）。
          ref: main
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Run recall-regression
        id: hybrid
        continue-on-error: true
        # 本 step が fail しても後続の rerank / query-planning step を評価するため
        # `continue-on-error: true` を付与する（Issue #311。従来は直列実行で本 step
        # が fail すると後続 2 step が GitHub Actions の既定挙動で skipped になり、
        # 一度も評価されない状態が続いていた）。job 全体の最終判定は末尾の
        # `Evaluate recall gates` step が 3 step の `outcome`（`continue-on-error`
        # 適用前の結果）を AND 集約して行う。
        #
        # 数値基準（Recall 下限）は spec（TASK-104・SEARCH-1, SEARCH-2）が SSOT のため
        # 本ワークフローにはハードコードしない。environment `recall-gate`（上の
        # `environment:` 参照。main のみに制限した deployment branch policy 付き）の
        # Actions secrets（`secrets.*`。Issue #286）から注入する。参照記法は repo
        # レベル secrets と同じ `secrets.*` だが、job に `environment:` を指定して
        # いるため解決スコープが environment レベルに切り替わる。
        #
        # `HYBRID_RECALL_REQUIRE_THRESHOLDS=1`（strict モード。冒頭コメント参照）を
        # 常に注入する: `HYBRID_RECALL_MIN_*` が未設定（environment 作成漏れ・
        # variable 名の誤り・variable の誤削除を含む）の場合、この workflow からの
        # 実行では fail-closed でテスト失敗とし、「一度も評価していない run」を
        # green にしない。ローカルの `make recall-regression` にはこのフラグを
        # 注入しないため、そちらは未設定を「対象外」として成功終了する opt-in
        # 挙動を維持する（`crates/engine/tests/hybrid_recall.rs::
        # resolve_gate_threshold` 参照）。設定済みで非数値・範囲外の場合は
        # strict モードの有無によらず常に fail-closed で非ゼロ終了する。ログには
        # 対象名と pass/fail のみが出力され、注入された閾値・実測値のいずれの
        # 数値も出力しない（Issue #303）。`RECALL_VERBOSE` は実測値を public な
        # Actions ログへ出す opt-in のため本 workflow の env へは意図的に追加
        # しない（テスト側も `GITHUB_ACTIONS` 下では拒否する二重化。実測値が
        # 必要な場合は `RECALL_VERBOSE=1 make recall-regression` をローカルで
        # 直接実行する）。大規模段（`HYBRID_RECALL_MIN_R20_LARGE`/
        # `HYBRID_RECALL_MIN_R100_LARGE`）は決定的スタブ `LlmClient` によるクエリ
        # 展開ありの経路で測定する（Issue #306。SEARCH-2 の測定前提に整合。
        # `docs/design/hybrid-recall-regression.md` 参照）。
        env:
          HYBRID_RECALL_REQUIRE_THRESHOLDS: "1"
          HYBRID_RECALL_MIN_R20_SMALL: ${{ secrets.HYBRID_RECALL_MIN_R20_SMALL }}
          HYBRID_RECALL_MIN_R20_LARGE: ${{ secrets.HYBRID_RECALL_MIN_R20_LARGE }}
          HYBRID_RECALL_MIN_R100_LARGE: ${{ secrets.HYBRID_RECALL_MIN_R100_LARGE }}
          # 非機密 opt-in（冒頭コメント参照）。`matrix.recall_engine` を `run:` へ
          # 直接展開せず `env:` 経由で渡す（式インジェクション回避の定石。末尾の
          # `Evaluate recall gates` step と同方針）。
          RECALL_ENGINE: ${{ matrix.recall_engine }}
        run: make recall-regression
      - name: Run rerank-regression
        id: rerank
        continue-on-error: true
        # 上の `Run recall-regression` step と同じ理由で `continue-on-error: true`
        # を付与し、hybrid の fail 有無に関わらず本 step を独立に評価する（Issue #311）。
        #
        # TASK-108（SEARCH-7）の層 B（`crates/engine/tests/rerank_recall.rs`）。
        # 数値基準（リランキング後の Recall@20 絶対下限。非劣化
        # `after_hits20 >= baseline_hits20` とあわせてブロッキング条件）は spec が
        # SSOT のため本 workflow にはハードコードしない。上の
        # `Run recall-regression` step と同じ environment `recall-gate`
        # （job の `environment:` 参照）の Actions secrets から注入する（Issue #286）。
        # baseline からの改善幅（`RERANK_RECALL_MIN_R20_IMPROVEMENT`）は SEARCH-7
        # 改訂（2026-08-31・fandhe-db-spec#8）により実コーパス評価まで
        # informational（非ブロッキング）へ降格したため、本 workflow からは注入
        # しない（`crates/engine/tests/rerank_recall.rs` が実測値のログ出力のみ
        # 行う。理由・実測総括は `docs/design/rerank-recall-regression.md`
        # 「SEARCH-7 改訂（2026-08-31）」節参照）。
        #
        # `RERANK_RECALL_REQUIRE_THRESHOLDS=1`（strict モード。冒頭コメント参照）を
        # 常に注入する: `RERANK_RECALL_MIN_R20_LARGE` が未設定の場合、この
        # workflow からの実行では fail-closed でテスト失敗とし、「一度も評価して
        # いない run」を green にしない。ローカルの `make rerank-regression` には
        # このフラグを注入しないため、そちらは未設定を「対象外」として成功終了する
        # opt-in 挙動を維持する（`crates/engine/tests/rerank_recall.rs::
        # resolve_gate_threshold` 参照）。設定済みで非数値・範囲外の場合は
        # strict モードの有無によらず常に fail-closed で非ゼロ終了する。ログ出力の
        # 契約（PR #340 で改訂）: 注入された閾値（`RERANK_RECALL_MIN_*`）の値と
        # 閾値近傍の `after_recall@20` 実測値は出力しない（後者は `RECALL_VERBOSE`
        # opt-in 時のみ。Issue #303）。一方、informational へ降格した
        # `improvement_ratio@20` とその導出入力（baseline/after/pool_ceiling の
        # hits 件数。層 A の公開固定アサート値と同一）は「実測値の記録と報告のみ
        # 必須」の契約（SEARCH-7 改訂 2026-08-31）を満たすため常時出力される。
        # `RECALL_VERBOSE` は本 workflow の env へ
        # 意図的に追加しない（`Run recall-regression` step と同方針）。
        env:
          RERANK_RECALL_REQUIRE_THRESHOLDS: "1"
          RERANK_RECALL_MIN_R20_LARGE: ${{ secrets.RERANK_RECALL_MIN_R20_LARGE }}
          # 非機密 opt-in（冒頭コメント参照）。
          RECALL_ENGINE: ${{ matrix.recall_engine }}
        run: make rerank-regression
      - name: Run query-planning-regression
        id: query_planning
        continue-on-error: true
        # 上の 2 step と同じ理由で `continue-on-error: true` を付与し、hybrid /
        # rerank の fail 有無に関わらず本 step を独立に評価する（Issue #311）。
        #
        # TASK-112（PLAN-1, PLAN-2）の層 B（`crates/engine/tests/query_planning_recall.rs`）。
        # 数値基準（intent カテゴリの改善幅下限・direct カテゴリの after Recall@20
        # 絶対下限・NoisyLlmClient〔非 oracle・劣化展開品質〕による intent 改善幅
        # 下限）は spec が SSOT のため本 workflow にはハードコードしない。上の
        # step と同じ environment `recall-gate`（job の `environment:` 参照）の
        # Actions secrets から注入する（Issue #286）。
        #
        # `QUERY_PLANNING_RECALL_MIN_INTENT_IMPROVEMENT_DEGRADED` は、既存 2 変数
        # （`MockLlmClient` の完全 oracle 写像専用に較正）を `NoisyLlmClient` の
        # 実測へ流用すると誤検知することが実測で確認された（codex-review・PR #265・
        # P1 指摘への対応。`crates/engine/tests/query_planning_recall.rs::
        # query_planning_recall_threshold_gate` のドキュメンテーションコメント・
        # `docs/design/query-planning-recall-regression.md` 参照）ため、劣化展開
        # シナリオ専用の下限として独立に追加した変数。
        #
        # `QUERY_PLANNING_RECALL_MIN_R20_DIRECT_LARGE` は TASK-113（PLAN-3）の
        # 大規模段（`crates/engine/tests/query_planning_recall.rs::
        # query_planning_recall_large_scale_threshold_gate`）専用の direct
        # カテゴリ絶対下限（`docs/spec/04-behavior/search.md` SEARCH-2 のスケール
        # 条件付き基準に対応）。小規模段の `QUERY_PLANNING_RECALL_MIN_R20_DIRECT`
        # とは別コーパス規模・別変数として独立に解決する。
        #
        # `QUERY_PLANNING_RECALL_REQUIRE_THRESHOLDS=1`（strict モード。冒頭コメント
        # 参照）を常に注入する: `QUERY_PLANNING_RECALL_MIN_*` が未設定の場合、この
        # workflow からの実行では fail-closed でテスト失敗とし、「一度も評価して
        # いない run」を green にしない。ローカルの `make query-planning-regression`
        # にはこのフラグを注入しないため、そちらは未設定を「対象外」として成功終了
        # する opt-in 挙動を維持する（`crates/engine/tests/query_planning_recall.rs::
        # resolve_gate_threshold_with` 参照）。設定済みで非数値・範囲外の場合は
        # strict モードの有無によらず常に fail-closed で非ゼロ終了する。ログ
        # には対象名と pass/fail のみが出力され、注入された閾値・実測値のいずれの
        # 数値も出力しない（Issue #303）。`RECALL_VERBOSE` は本 workflow の env へ
        # 意図的に追加しない（`Run recall-regression` step と同方針）。
        env:
          QUERY_PLANNING_RECALL_REQUIRE_THRESHOLDS: "1"
          QUERY_PLANNING_RECALL_MIN_INTENT_IMPROVEMENT: ${{ secrets.QUERY_PLANNING_RECALL_MIN_INTENT_IMPROVEMENT }}
          QUERY_PLANNING_RECALL_MIN_R20_DIRECT: ${{ secrets.QUERY_PLANNING_RECALL_MIN_R20_DIRECT }}
          QUERY_PLANNING_RECALL_MIN_INTENT_IMPROVEMENT_DEGRADED: ${{
            secrets.QUERY_PLANNING_RECALL_MIN_INTENT_IMPROVEMENT_DEGRADED }}
          QUERY_PLANNING_RECALL_MIN_R20_DIRECT_LARGE: ${{
            secrets.QUERY_PLANNING_RECALL_MIN_R20_DIRECT_LARGE }}
          # 非機密 opt-in（冒頭コメント参照）。
          RECALL_ENGINE: ${{ matrix.recall_engine }}
        run: make query-planning-regression
      - name: Evaluate recall gates
        # 3 つの gate step（hybrid / rerank / query_planning）は `continue-on-error: true`
        # のため単体では job を failure にしない。本 step が `steps.<id>.outcome`
        # （`continue-on-error` 適用前の結果。`success` / `failure` / `cancelled` /
        # `skipped`）を AND 集約し、1 つでも `success` 以外なら非ゼロ終了して job を
        # failure にする（Issue #311）。`conclusion`（適用後。`continue-on-error` により
        # 常に `success` になる）ではなく `outcome` を見ることで、hybrid が fail した
        # run で rerank / query-planning が一度も評価されず job だけ green になる
        # （実測: run 33251403345 で後続 2 step が skipped）誤 green 化を防ぐ。
        # 値は `run:` へ直接展開せず `env:` 経由で渡す（式インジェクション回避の定石）。
        # 出力は gate 名と outcome / pass のみで、閾値・実測値は扱わない（Issue #303 の
        # 抑止方針を維持）。既定の `if: success()` のまま（`if:` を付けない）にする
        # ことで、gate step の fail では本 step は skip されず（`continue-on-error` に
        # より conclusion が success のため）、一方 Checkout・rustup 等の前段が失敗
        # した場合は本 step も走らず job がそのまま red になる（いずれも誤 green
        # 化しない）。
        env:
          HYBRID_OUTCOME: ${{ steps.hybrid.outcome }}
          RERANK_OUTCOME: ${{ steps.rerank.outcome }}
          QUERY_PLANNING_OUTCOME: ${{ steps.query_planning.outcome }}
        run: |
          set -eu
          pass=true
          for gate in hybrid rerank query_planning; do
            case "$gate" in
              hybrid) outcome="${HYBRID_OUTCOME:-}" ;;
              rerank) outcome="${RERANK_OUTCOME:-}" ;;
              query_planning) outcome="${QUERY_PLANNING_OUTCOME:-}" ;;
            esac
            echo "gate=${gate} outcome=${outcome:-unknown}"
            if [ "${outcome}" != "success" ]; then pass=false; fi
          done
          echo "pass=${pass}"
          [ "${pass}" = "true" ]
