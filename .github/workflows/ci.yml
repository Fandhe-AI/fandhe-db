name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR ごとに一意な番号を group に含める（head_ref のみだと fork 間で同名ブランチの
  # 別 PR が同一グループになり、互いの CI を cancel し合う。PR #4 codex P2 指摘）
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint）
  # --------------------------------------------------
  # Fandhe-AI/actions の lint-docs reusable workflow（lint ツールバージョンは
  # 共通側で固定。agent-cli-skills の同名ジョブと同型）を呼び出す。
  # 設定はそれぞれ `.markdownlint.jsonc` / `.markdownlintignore` /
  # `.editorconfig` + `.editorconfig-checker.json` / `.yamllint` /
  # `commitlint.config.mjs` を参照する。
  #
  # 必須チェックの集約: reusable 側の集約ジョブ `lint-docs / lint-docs-complete`
  # （fail-closed。各 lint ジョブは boolean input の if: を持つ条件付きジョブとして
  # 明示リストで skipped を判定する）を branch protection の必須チェックに使う。
  # Rust 実装の着手時は rust-base-ci reusable workflow のジョブを本 workflow へ
  # 追加し、必須チェックへその集約ジョブ（rust-base-ci-complete）を加えること。
  lint-docs:
    # Fandhe-AI/actions は可変タグ latest（move-latest-tag 管理で main へ追従）で
    # 参照する（組織現行標準。AGENTS.md「CI・ワークフローの改変」の例外を参照）
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      markdownlint: true
      editorconfig: true
      yamllint: true
      # commitlint は PR の base/head から commit 範囲を取るため pull_request 専用
      # （reusable 側は他イベントを fail-closed で拒否する）。push でも動く本
      # workflow では event で切り替え、main への push では実行しない
      commitlint: ${{ github.event_name == 'pull_request' }}

  # --------------------------------------------------
  # rust-ci（Rust ベースライン品質ゲート: fmt / clippy / test / cargo-deny）
  # --------------------------------------------------
  # TASK-66 の workspace 追加（Cargo.toml）に伴い有効化。集約ジョブは reusable 側の
  # `rust-base-ci-complete`（本呼び出しからは `rust-ci / rust-base-ci-complete` として
  # 見える）。branch protection の必須チェックへ追加する運用はユーザー作業（PR 本文参照）。
  rust-ci:
    uses: Fandhe-AI/actions/.github/workflows/rust-base-ci.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（lint-docs と同方針）
      runner-label: ubuntu-latest
      # make deny（Makefile の deny ターゲット）と同一のチェック集合
      deny-checks: advisories bans licenses sources
      # cargo レジストリ・target の cache（reusable 側のオプトイン入力。
      # `actions/cache`・key は `**/Cargo.lock` のハッシュ）。ホステッド runner は毎回
      # まっさらなため、無効のままだと clippy／test／deny の各ジョブが `--all-features`
      # の依存（usearch の C++ ビルド・ort・tokenizers・wgpu）を毎回フルビルドし、
      # test ジョブだけで約 5 分をビルドに費やしていた。cache-key-prefix は
      # 他リポジトリと同じ既定値 `rust-base-ci` との衝突回避のため本リポ名にする
      cache: true
      cache-key-prefix: vector-db

  # --------------------------------------------------
  # test-default-build（既定ビルド専用の回帰テスト。Issue #710・#715）
  # --------------------------------------------------
  # rust-ci（reusable workflow）の test ジョブは `cargo test --workspace
  # --all-features` で実行するため feature fault-injection が常に有効になり、
  # 既定ビルド（feature 無効）時の挙動を検証する
  # default_build_rejects_fault_inject_flag_as_unknown_argument
  # （wire_fault_injection_cli）が実行対象に入らない。Makefile の
  # test-default-build ターゲット（--all-features を付けない単体実行）を直接
  # 呼び出す独立ジョブとして接続する（Bugbot 指摘・PR #718）。rust-ci
  # （reusable workflow）とは異なり生の steps を持つ独立ジョブとして定義するため、
  # 第三者 action（actions/checkout）は SHA 固定で参照する
  # （AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは Fandhe-AI/actions のみ）。
  # branch protection の必須チェックへ追加する運用は rust-ci と同様ユーザー作業（PR 本文参照）。
  test-default-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Run test-default-build
        run: make test-default-build

  # --------------------------------------------------
  # crash-test（クラッシュ耐性回帰テスト。TASK-142・対象ビヘイビア PERSIST-1）
  # --------------------------------------------------
  # プロセス外からの SIGKILL → 再起動 → 内容検証を行う回帰テスト（scripts/crash_test.sh）。
  # rust-ci（reusable workflow）とは異なり生の steps を持つ独立ジョブとして定義するため、
  # 第三者 action（actions/checkout）は SHA 固定で参照する
  # （AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは Fandhe-AI/actions のみ）。
  # private submodule（docs/spec）は取得しない（spec 抜きでビルド・テストが成立する方針を維持）。
  # branch protection の必須チェックへ追加する運用は rust-ci と同様ユーザー作業（PR 本文参照）。
  crash-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Run crash-test
        run: make crash-test

  # --------------------------------------------------
  # crash-test-interrupt（crash_test.sh の中断パス・回帰テスト。
  # Issue #134・TASK-142）
  # --------------------------------------------------
  # crash_test.sh 自身の SIGTERM 単体受信時（pid/pgroup 両変種）に writer プロセスが
  # 確実に停止し WORKDIR が削除されることを検証する回帰テスト
  # （scripts/crash_test_interrupt.sh）。rust-ci（reusable workflow）とは異なり生の
  # steps を持つ独立ジョブとして定義するため、第三者 action（actions/checkout）は SHA
  # 固定で参照する（AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは
  # Fandhe-AI/actions のみ）。private submodule（docs/spec）は取得しない（spec 抜きで
  # ビルド・テストが成立する方針を維持）。
  # branch protection の必須チェックへ追加する運用は rust-ci と同様ユーザー作業（PR 本文参照）。
  crash-test-interrupt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Run crash-test-interrupt
        run: make crash-test-interrupt

  # --------------------------------------------------
  # crash-test-cross-table（2 テーブル横断トランザクション・クラッシュ耐性回帰テスト。
  # TASK-90・対象ビヘイビア TABLE-10）
  # --------------------------------------------------
  # プロセス外からの SIGKILL → 再起動 → テーブル間整合・バッチ整合の検証を行う回帰テスト
  # （scripts/crash_test_cross_table.sh）。rust-ci（reusable workflow）とは異なり生の
  # steps を持つ独立ジョブとして定義するため、第三者 action（actions/checkout）は SHA
  # 固定で参照する（AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは
  # Fandhe-AI/actions のみ）。private submodule（docs/spec）は取得しない（spec 抜きで
  # ビルド・テストが成立する方針を維持）。
  # branch protection の必須チェックへ追加する運用は rust-ci と同様ユーザー作業（PR 本文参照）。
  crash-test-cross-table:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Run crash-test-cross-table
        run: make crash-test-cross-table

  # --------------------------------------------------
  # crash-test-unique-index（永続一意索引・クラッシュ耐性回帰テスト。
  # Issue #1070・対象ビヘイビア TABLE-16）
  # --------------------------------------------------
  # プロセス外からの SIGKILL → 再起動 → 索引と行データの整合性検証を行う回帰テスト
  # （scripts/crash_test_unique_index.sh）。crash-test-cross-table と同じ理由で
  # 独立ジョブとして定義し、第三者 action（actions/checkout）は SHA 固定で参照する。
  # private submodule（docs/spec）は取得しない。
  crash-test-unique-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Run crash-test-unique-index
        run: make crash-test-unique-index

  # --------------------------------------------------
  # core-api-check（コア API シグネチャ差分検知。TASK-125・対象ビヘイビア CORE-1）
  # --------------------------------------------------
  # プロトコル層（wire-server 等）の追加・変更がコア API（VectorCore/SearchProvider）の
  # シグネチャ変更を伴わないことを scripts/check_core_api.sh（cargo 不要のテキスト比較）
  # で機械チェックする。rust-ci（reusable workflow）とは異なり生の steps を持つ独立
  # ジョブとして定義するため、第三者 action（actions/checkout）は SHA 固定で参照する
  # （AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは Fandhe-AI/actions
  # のみ）。テキスト比較のみで Rust toolchain は不要なため checkout のみで完結する。
  # branch protection の必須チェックへ追加する運用は rust-ci と同様ユーザー作業（PR 本文参照）。
  core-api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run core-api-check
        run: make core-api-check

  # --------------------------------------------------
  # sort-determinism-check（ソート非決定性 API 再混入検知。TASK-84・対応 Issue #61）
  # --------------------------------------------------
  # RRF 融合結果等のスコア順 Top-k で同点タイブレークを省略する非決定的ソート API
  # （`sort_unstable_by`/`sort_unstable_by_key`/`select_nth_unstable_by(_key)`）の
  # 再混入を scripts/check_sort_determinism.sh（cargo 不要のテキスト比較）で機械
  # チェックする。core-api-check と同様の理由で独立ジョブとし、第三者 action は
  # 同一 SHA 固定を使う。判断の根拠は docs/design/rrf-tie-break-determinism.md 参照。
  sort-determinism-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run sort-determinism-check
        run: make sort-determinism-check

  # --------------------------------------------------
  # simd-codegen-check（SIMD カーネル生成コード検査。Issue #467・TASK-156 関連）
  # --------------------------------------------------
  # `isa.rs` の `#[target_feature]` カーネルが `as_chunks` からの要素ごと構築
  # （将来 intrinsics 導入時の `_mm256_set_ps` 等）で単一ロード命令へ最適化される
  # のは LLVM の最適化挙動であり言語仕様の保証ではないため、`cargo rustc --emit
  # asm` で実際に生成されたアセンブリを scripts/check_simd_codegen.sh が走査し、
  # 要素ごと挿入命令（`vinsertps`／`vpinsr*` 等）が残っていないかを機械検査する。
  # core-api-check・sort-determinism-check と異なり engine の release フルビルド
  # （wgpu 等の依存を含む）を伴うため timeout を長めに取り、独立ジョブとして
  # rust-ci（cargo test 等）と並列実行できるようにする。詳細は
  # docs/design/simd-codegen-guard.md 参照。第三者 action は他ジョブと同一 SHA 固定。
  simd-codegen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Run simd-codegen-check
        run: make simd-codegen-check

  # --------------------------------------------------
  # cross-check（aarch64 クロスコンパイル確認。TASK-156・対象ビヘイビア CORE-14）
  # --------------------------------------------------
  # `isa.rs` の NEON カーネル（`#[cfg(target_arch = "aarch64")]`）が x86_64 の
  # rust-ci ジョブではコンパイル対象に入らないため、`cargo check --target
  # aarch64-unknown-linux-gnu`（リンクしないためクロスリンカ不要）で構文・型検査
  # だけ別途確認する。rust-ci（reusable workflow）とは異なり生の steps を持つ独立
  # ジョブとして定義するため、第三者 action（actions/checkout）は SHA 固定で参照する
  # （AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは Fandhe-AI/actions
  # のみ）。private submodule（docs/spec）は取得しない（spec 抜きでビルドが成立する方針を
  # 維持）。branch protection の必須チェックへ追加する運用は他ジョブと同様ユーザー作業
  # （PR 本文参照）。
  cross-check:
    runs-on: ubuntu-latest
    # aarch64 版 simd-codegen-check（engine の release フルビルドを伴う）を
    # 追加したため、cargo check のみを前提にした従来の 15 分から引き上げる
    # （Issue #467・F9: ローカル増分計測で aarch64 emit-asm ビルドは約 34s だが
    # CI のクリーンビルドはこれより長くなりうる）。
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Add aarch64-unknown-linux-gnu target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Run check-cross
        run: make check-cross
      - name: Run simd-codegen-check-cross
        run: make simd-codegen-check-cross
