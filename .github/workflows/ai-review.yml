# Fandhe-AI/actions の ai-review reusable workflow を呼び出す薄い wrapper
# （旧 codex-review.yml から移行）。導入手順・runner 要件・受容済み残留リスクは
# Fandhe-AI/actions の ai-review/README.md を参照。
#
# 有効化のスイッチは呼び出し先 reusable workflow の fail-closed ガードに従う:
# Actions variable `CODEX_HOME_DIR` が未設定の間は review / post_feedback が skip される。
name: AI PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# reusable workflow のトップレベル concurrency は機能しないため呼び出し側で設定する
concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # update-external.yml が生成する同期 PR に限り AI レビューを skip してよいかを判定する前段ジョブ。
  # 同期 PR は上流の取り込みそのもので、AI の指摘があってもこの PR では直せない（修正先は
  # 取り込み元の上流リポジトリ）。ブランチ名だけで skip すると任意の変更で gate を回避できるため、
  # 以下をすべて満たす場合にのみ該当接頭辞を出力する（1 つでも欠ければ空＝通常どおりレビュー）:
  # - head branch が同期 PR の接頭辞（chore/skills-update- / chore/submodule-update-）に一致
  # - 同一リポジトリ内のブランチで、PR 作成者が同期 PR の作成主体（SUBMODULE_PAT の所有者）
  # - 変更ファイル（rename 元を含む）が接頭辞ごとの許可パスに限られる
  #   （skills: `.agents/skills/**`・`skills-lock.json` / submodule: `docs/spec` の gitlink のみ）
  # - ファイル一覧取得の前後で PR の head SHA がイベント時点から変わっておらず、件数が一致する
  # 受容済み残留リスク: 同期 PR の作成主体が許可パス内を任意に変更した PR は skip される
  # （Fandhe-AI/actions の ai-review/README.md「skip-branch-prefixes の受容済み残留リスク」。
  # 第三者の write コラボレーターを迎える・作成主体が変わる場合は見直す）。
  skip-guard:
    runs-on: ubuntu-latest
    # ハングしたジョブの無期限実行を防ぐ
    timeout-minutes: 5
    # PR の変更ファイル一覧の取得にのみ使う（読み取り専用）
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip-prefixes: ${{ steps.check.outputs.skip-prefixes }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TRUSTED_AUTHOR: aLiz-Nancy
        run: |
          set -euo pipefail
          # 値は untrusted として扱い、workflow command 行へ展開しない
          no_skip() {
            echo "::notice::同期 PR の skip 条件を満たさないため AI レビューを実行します"
            echo "skip-prefixes=" >> "${GITHUB_OUTPUT}"
            exit 0
          }
          case "${HEAD_REF}" in
            chore/skills-update-*)
              prefix='chore/skills-update-'
              allow_re='^(\.agents/skills/.+|skills-lock\.json)$'
              ;;
            chore/submodule-update-*)
              prefix='chore/submodule-update-'
              allow_re='^docs/spec$'
              ;;
            *)
              echo "skip-prefixes=" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          if [ "${HEAD_REPO}" != "${REPO}" ] || [ "${AUTHOR}" != "${TRUSTED_AUTHOR}" ]; then
            no_skip
          fi
          pr_state() {
            gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '"\(.head.sha) \(.changed_files)"'
          }
          read -r sha_before count_before < <(pr_state)
          files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          listed=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' | wc -l)
          read -r sha_after count_after < <(pr_state)
          if [ "${sha_before}" != "${HEAD_SHA}" ] || [ "${sha_after}" != "${HEAD_SHA}" ] \
            || [ "${count_before}" != "${count_after}" ] || [ "${listed}" -ne "${count_after}" ] \
            || [ "${count_after}" -eq 0 ] || [ -z "${files}" ]; then
            no_skip
          fi
          while IFS= read -r f; do
            if ! [[ "${f}" =~ ${allow_re} ]]; then
              no_skip
            fi
          done <<< "${files}"
          echo "::notice::同期 PR の skip 条件を満たしたため AI レビューを skip します"
          echo "skip-prefixes=${prefix}" >> "${GITHUB_OUTPUT}"

  # ジョブ ID が check 名の先頭になる（codex / preflight・codex / review・codex / post_feedback）。
  # ruleset の required status checks はこの 3 つと skip-guard を登録する（preflight の失敗時は後続が
  # skipped になり、skipped は required check を満たすため preflight も必ず required にする）
  codex:
    # skip-guard が失敗しても（出力が空になり）通常どおりレビューする fail-closed。
    # needs の失敗で本ジョブごと skipped になると required check を満たしてしまうため !cancelled() で実行する
    needs: skip-guard
    if: ${{ !cancelled() }}
    # review ジョブは runner 既定値（provider と同名の用途ラベル codex = self-hosted の codex 専用
    # runner）を使う。fork PR では reusable workflow 側が fail-closed で実行を拒否するため、
    # untrusted コードが self-hosted runner 上で実行されることはない。
    # preflight / post_feedback は資格情報に触れないため、public リポジトリの組織 runner 方針
    # どおり GitHub ホステッド（ubuntu-latest）を使う（Fandhe-AI/actions docs/runner-policy.md）。
    uses: Fandhe-AI/actions/.github/workflows/ai-review.yml@latest
    permissions:
      contents: read
      pull-requests: write
    with:
      provider: codex
      # skip-guard が条件を満たした同期 PR の接頭辞だけを渡す（それ以外は空＝全 PR をレビュー）。
      # skip 時の review / post_feedback は skipped となり required check を満たす。
      skip-branch-prefixes: ${{ needs.skip-guard.outputs.skip-prefixes }}
      post-feedback-runner: ubuntu-latest
